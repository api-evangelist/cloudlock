aid: cloudlock
name: CloudLock
description: >-
  CloudLock is a cloud-native Cloud Access Security Broker (CASB) that protects
  data, users, and applications across SaaS, IaaS, PaaS, and IDaaS environments.
  Founded in 2011 and acquired by Cisco in 2016, it is now delivered as Cisco
  Cloudlock within Cisco Umbrella / Cisco Security Cloud. The platform uses an
  API-driven model to discover sensitive content, detect policy violations, flag
  anomalous user behavior, and manage cloud application (OAuth) risk. Developers
  integrate through the Cisco Cloudlock API (v2), a Bearer-token REST API exposing
  activities, incidents, incident entities, incident aggregates, policies, apps,
  entities, IP libraries, and anomalies. Originally a portfolio company of Bessemer
  Venture Partners, CloudLock's developer surface is documented on Cisco DevNet and
  the Cisco Umbrella documentation hub.
